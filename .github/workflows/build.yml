name: Build

on: [push, pull_request]

jobs:

  linux:

    name: Linux

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]

    env:
      CC: ${{ matrix.compiler }}

    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libbluetooth-dev libusb-1.0-0-dev autoconf-archive
      - run: autoreconf --install --force
      - run: ./configure
      - run: make
      - run: make check
      - name: Package artifacts
        run: |
          make install DESTDIR=$PWD/artifacts
          tar -czf ${{ github.job }}-${{ matrix.compiler }}.tar.gz -C artifacts usr/local
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ github.job }}-${{ matrix.compiler }}.tar.gz
          archive: false

  mac:

    name: Mac

    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]

    env:
      CC: ${{ matrix.compiler }}

    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: brew install autoconf automake libtool autoconf-archive hidapi libusb
      - run: autoreconf --install --force
      - run: ./configure
      - run: make
      - run: make check
      - name: Package artifacts
        run: |
          make install DESTDIR=$PWD/artifacts
          tar -czf ${{ github.job }}-${{ matrix.compiler }}.tar.gz -C artifacts usr/local
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ github.job }}-${{ matrix.compiler }}.tar.gz
          archive: false
